<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Warehouse Expenses — Rags Heaven</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
.exp-hero {
  background: linear-gradient(135deg, #450a0a 0%, #7f1d1d 55%, #111827 100%);
  border-radius: 16px;
  padding: 18px;
  color: #fff;
  margin-bottom: 14px;
  box-shadow: 0 10px 25px rgba(127, 29, 29, 0.22);
}
.exp-kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-top: 12px;
}
@media (max-width: 720px) {
  .exp-kpi-grid { grid-template-columns: repeat(2, 1fr); }
}
.exp-kpi-box {
  background: rgba(255,255,255,0.09);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 10px;
  padding: 10px 12px;
}
.exp-kpi-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #fecaca; font-weight: 700; }
.exp-kpi-val { font-size: 17px; font-weight: 800; color: #fff; margin-top: 2px; }
.exp-kpi-sub { font-size: 10.5px; color: #e2e8f0; margin-top: 2px; }

.exp-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-left: 4px solid #991b1b;
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
}
.exp-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.exp-ref { font-family: monospace; font-size: 11px; font-weight: 800; color: #991b1b; background: #fef2f2; padding: 2px 7px; border-radius: 5px; border: 1px solid #fecaca; }
.exp-cat { font-size: 10.5px; font-weight: 700; color: #475569; background: #f1f5f9; padding: 2px 8px; border-radius: 99px; }
.exp-amt { font-size: 16px; font-weight: 800; color: #991b1b; }

.btn-exp {
  padding: 7px 12px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  border: 1px solid var(--border);
  background: #fff;
  color: var(--text-main);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: inherit;
}
.btn-exp.primary { background: #991b1b; color: #fff; border-color: #991b1b; }
.btn-exp.dark { background: #111827; color: #fff; border-color: #111827; }
.btn-exp.danger { background: #fee2e2; color: #b91c1c; border-color: #fecaca; }

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,0.65);
  backdrop-filter: blur(4px);
  z-index: 2500;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 12px;
}
.modal-overlay.open { display: flex; }
.modal-content {
  background: #fff;
  border-radius: 14px;
  width: 100%;
  max-width: 540px;
  max-height: 92vh;
  overflow-y: auto;
  padding: 18px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.28);
}
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
.modal-title { font-size: 16px; font-weight: 800; color: #991b1b; }
.btn-modal-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); }
.field-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 600px) { .field-grid-2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <img src="logo_hd.png" class="topbar-logo" alt="Rags Heaven" onerror="this.src='logo.png'">
    <div class="topbar-title">Warehouse Expenses</div>
    <div id="roleBadge" class="role-badge">Super User</div>
    <button onclick="handleGlobalProfileClick()" style="background:none;border:1px solid var(--border);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0" title="User Profile">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </button>
  </div>

  <div class="content">
    <div class="exp-hero">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
        <div>
          <div style="font-size:11px;font-weight:700;color:#fecaca;letter-spacing:0.6px;text-transform:uppercase;">Finance Deck &bull; Super User Exclusive</div>
          <div style="font-size:20px;font-weight:800;margin-top:2px;">Complete Warehouse Expenses</div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn-exp dark" onclick="exportLuxuryExpensesPdf()">💎 Luxury Expense Report (PDF)</button>
          <button class="btn-exp primary" style="background:#059669;border-color:#059669;" onclick="openExpenseModal()">+ Record Expense</button>
        </div>
      </div>

      <div class="exp-kpi-grid">
        <div class="exp-kpi-box">
          <div class="exp-kpi-label">Filtered Total</div>
          <div class="exp-kpi-val" id="kpiExpTotal">PKR 0</div>
          <div class="exp-kpi-sub" id="kpiExpCount">0 entries</div>
        </div>
        <div class="exp-kpi-box">
          <div class="exp-kpi-label">This Month</div>
          <div class="exp-kpi-val" id="kpiExpMonth">PKR 0</div>
          <div class="exp-kpi-sub" id="kpiExpMonthLabel">-</div>
        </div>
        <div class="exp-kpi-box">
          <div class="exp-kpi-label">Today's Expenses</div>
          <div class="exp-kpi-val" id="kpiExpToday">PKR 0</div>
          <div class="exp-kpi-sub">Recorded today</div>
        </div>
        <div class="exp-kpi-box">
          <div class="exp-kpi-label">Top Category</div>
          <div class="exp-kpi-val" id="kpiExpTopCat" style="font-size:13px;">—</div>
          <div class="exp-kpi-sub" id="kpiExpTopAmt">PKR 0</div>
        </div>
      </div>
    </div>

    <!-- Filters -->
    <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:14px;">
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <div class="search-wrap" style="flex:2;min-width:180px;margin-bottom:0;">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="expSearchInput" placeholder="Search expense title, ref #, notes..." oninput="renderExpensesList()">
        </div>
        <select id="expCatFilter" onchange="renderExpensesList()" style="flex:1;min-width:150px;height:38px;border:1px solid var(--border);border-radius:8px;padding:0 8px;font-size:12px;font-weight:600;">
          <option value="">-- All Categories --</option>
          <option value="Rent & Utilities">Rent &amp; Utilities</option>
          <option value="Electricity & Generator">Electricity &amp; Generator</option>
          <option value="Packing & Bales Material">Packing &amp; Bales Material</option>
          <option value="Transport & Freight">Transport &amp; Freight</option>
          <option value="Staff Tea & Meals">Staff Tea &amp; Meals</option>
          <option value="Maintenance & Repairs">Maintenance &amp; Repairs</option>
          <option value="Customs & Clearance">Customs &amp; Clearance</option>
          <option value="Salaries & Wages">Salaries &amp; Wages</option>
          <option value="Miscellaneous">Miscellaneous</option>
        </select>
        <div style="display:flex;gap:6px;align-items:center;">
          <input type="month" id="expMonthFilter" onchange="renderExpensesList()" style="height:38px;border:1px solid var(--border);border-radius:8px;padding:0 8px;font-size:12px;font-weight:600;background:#fff;">
          <button type="button" class="btn-exp" onclick="document.getElementById('expMonthFilter').value='';renderExpensesList();" style="height:38px;">All</button>
        </div>
      </div>
    </div>

    <div id="expensesListContainer">
      <div style="padding:30px;text-align:center;color:var(--muted);">Loading expenses...</div>
    </div>
  </div>
</div>

<!-- Expense Modal -->
<div id="expenseModal" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-head">
      <div class="modal-title" id="expModalTitle">Record Warehouse Expense</div>
      <button class="btn-modal-close" onclick="closeExpenseModal()">&times;</button>
    </div>
    <form onsubmit="saveExpenseRecord(event)">
      <input type="hidden" id="editExpId">
      <div class="field-grid-2">
        <div class="field"><label>Date *</label><input type="date" id="expDate" required></div>
        <div class="field"><label>Category *</label>
          <select id="expCategory" required>
            <option value="Rent & Utilities">Rent &amp; Utilities</option>
            <option value="Electricity & Generator">Electricity &amp; Generator</option>
            <option value="Packing & Bales Material">Packing &amp; Bales Material</option>
            <option value="Transport & Freight">Transport &amp; Freight</option>
            <option value="Staff Tea & Meals">Staff Tea &amp; Meals</option>
            <option value="Maintenance & Repairs">Maintenance &amp; Repairs</option>
            <option value="Customs & Clearance">Customs &amp; Clearance</option>
            <option value="Salaries & Wages">Salaries &amp; Wages</option>
            <option value="Miscellaneous">Miscellaneous</option>
          </select>
        </div>
      </div>
      <div class="field"><label>Expense Title / Description *</label><input type="text" id="expTitle" required placeholder="e.g. Diesel for Warehouse Generator"></div>
      <div class="field-grid-2">
        <div class="field"><label>Amount (PKR) *</label><input type="number" id="expAmount" required min="1" step="0.01" placeholder="e.g. 15000"></div>
        <div class="field"><label>Payment Method</label>
          <select id="expMethod">
            <option value="Cash">Cash</option>
            <option value="Bank Transfer">Bank Transfer</option>
            <option value="Online / JazzCash / EasyPaisa">Online / Mobile</option>
            <option value="Cheque">Cheque</option>
          </select>
        </div>
      </div>
      <div class="field-grid-2">
        <div class="field"><label>Paid By</label><input type="text" id="expPaidBy" placeholder="e.g. Super User / Petty Cash"></div>
        <div class="field"><label>Receipt / Bill Ref #</label><input type="text" id="expRefNo" placeholder="Optional"></div>
      </div>
      <div class="field"><label>Notes</label><input type="text" id="expNotes" placeholder="Optional details..."></div>
      <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px;">
        <button type="button" class="btn-exp" onclick="closeExpenseModal()">Cancel</button>
        <button type="submit" class="btn-exp primary">💾 Save Expense</button>
      </div>
    </form>
  </div>
</div>

<script src="shared.js"></script>
<script src="document_engine.js"></script>
<script>
const LS_EXP_KEY = 'rh_warehouse_expenses_cache';
let expensesList = [];

async function initExpensesPage() {
  if (!requireAuth(['super_user'])) return;
  if (!canAccessFinance()) {
    showToast('Expenses module is restricted to Super User', true);
    setTimeout(() => location.replace('dashboard.html'), 700);
    return;
  }
  const user = getCurrentUser() || {};
  const badge = document.getElementById('roleBadge');
  if (badge) badge.textContent = getRoleName(user.role || getRole());

  document.getElementById('expMonthFilter').value = new Date().toISOString().slice(0, 7);
  await loadExpenses();
}

async function loadExpenses() {
  try {
    const res = await sbGet('warehouse_expenses');
    expensesList = Array.isArray(res) ? res : JSON.parse(localStorage.getItem(LS_EXP_KEY) || '[]');
  } catch (e) {
    expensesList = JSON.parse(localStorage.getItem(LS_EXP_KEY) || '[]');
  }
  try { localStorage.setItem(LS_EXP_KEY, JSON.stringify(expensesList)); } catch (e) {}
  renderExpensesList();
}

function getFilteredExpenses() {
  const q = (document.getElementById('expSearchInput').value || '').toLowerCase().trim();
  const cat = document.getElementById('expCatFilter').value;
  const mon = document.getElementById('expMonthFilter').value;
  return [...expensesList].sort((a, b) => (b.date || '').localeCompare(a.date || '')).filter(e => {
    if (cat && e.category !== cat) return false;
    if (mon && !(e.date || '').startsWith(mon)) return false;
    if (!q) return true;
    return (e.title || '').toLowerCase().includes(q)
      || (e.expense_no || '').toLowerCase().includes(q)
      || (e.category || '').toLowerCase().includes(q)
      || (e.notes || '').toLowerCase().includes(q);
  });
}

function renderExpensesList() {
  const filtered = getFilteredExpenses();
  const todayStr = new Date().toISOString().slice(0, 10);
  const curMonth = new Date().toISOString().slice(0, 7);

  const filtTotal = filtered.reduce((s, e) => s + (parseFloat(e.amount) || 0), 0);
  const monthTotal = expensesList.filter(e => (e.date || '').startsWith(curMonth)).reduce((s, e) => s + (parseFloat(e.amount) || 0), 0);
  const todayTotal = expensesList.filter(e => e.date === todayStr).reduce((s, e) => s + (parseFloat(e.amount) || 0), 0);

  const catTotals = {};
  filtered.forEach(e => { catTotals[e.category || 'Miscellaneous'] = (catTotals[e.category || 'Miscellaneous'] || 0) + (parseFloat(e.amount) || 0); });
  const topCat = Object.entries(catTotals).sort((a, b) => b[1] - a[1])[0];

  document.getElementById('kpiExpTotal').textContent = 'PKR ' + filtTotal.toLocaleString();
  document.getElementById('kpiExpCount').textContent = `${filtered.length} entr${filtered.length === 1 ? 'y' : 'ies'}`;
  document.getElementById('kpiExpMonth').textContent = 'PKR ' + monthTotal.toLocaleString();
  document.getElementById('kpiExpMonthLabel').textContent = curMonth;
  document.getElementById('kpiExpToday').textContent = 'PKR ' + todayTotal.toLocaleString();
  document.getElementById('kpiExpTopCat').textContent = topCat ? topCat[0] : '—';
  document.getElementById('kpiExpTopAmt').textContent = topCat ? 'PKR ' + topCat[1].toLocaleString() : 'PKR 0';

  const container = document.getElementById('expensesListContainer');
  if (!filtered.length) {
    container.innerHTML = `<div style="padding:36px 20px;text-align:center;color:var(--muted);background:#fff;border-radius:12px;border:1px dashed var(--border);">No expenses recorded matching your filters.</div>`;
    return;
  }

  container.innerHTML = filtered.map(e => `
    <div class="exp-card">
      <div class="exp-card-top">
        <div>
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px;">
            <span class="exp-ref">${escapeHtml(e.expense_no || 'EXP')}</span>
            <span class="exp-cat">${escapeHtml(e.category || 'Miscellaneous')}</span>
          </div>
          <div style="font-size:14px;font-weight:800;color:#0f172a;">${escapeHtml(e.title)}</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px;">
            📅 ${e.date || '-'} &bull; 💳 ${escapeHtml(e.payment_method || 'Cash')}${e.paid_by ? ' &bull; By ' + escapeHtml(e.paid_by) : ''}${e.ref_no ? ' &bull; Ref: ' + escapeHtml(e.ref_no) : ''}
          </div>
          ${e.notes ? `<div style="font-size:11px;color:#475569;margin-top:4px;font-style:italic;">📝 ${escapeHtml(e.notes)}</div>` : ''}
        </div>
        <div style="text-align:right;">
          <div class="exp-amt">PKR ${(parseFloat(e.amount) || 0).toLocaleString()}</div>
          <div style="display:flex;gap:6px;margin-top:8px;justify-content:flex-end;">
            <button class="btn-exp" style="padding:4px 8px;font-size:11px;" onclick="openExpenseModal('${e.id}')">✏ Edit</button>
            <button class="btn-exp danger" style="padding:4px 8px;font-size:11px;" onclick="deleteExpense('${e.id}')">🗑</button>
          </div>
        </div>
      </div>
    </div>
  `).join('');
}

function openExpenseModal(id = null) {
  document.getElementById('editExpId').value = id || '';
  if (id) {
    const e = expensesList.find(x => x.id == id);
    if (!e) return;
    document.getElementById('expModalTitle').textContent = `Edit Expense — ${e.expense_no}`;
    document.getElementById('expDate').value = e.date || new Date().toISOString().slice(0, 10);
    document.getElementById('expCategory').value = e.category || 'Miscellaneous';
    document.getElementById('expTitle').value = e.title || '';
    document.getElementById('expAmount').value = e.amount || 0;
    document.getElementById('expMethod').value = e.payment_method || 'Cash';
    document.getElementById('expPaidBy').value = e.paid_by || '';
    document.getElementById('expRefNo').value = e.ref_no || '';
    document.getElementById('expNotes').value = e.notes || '';
  } else {
    document.getElementById('expModalTitle').textContent = 'Record Warehouse Expense';
    document.getElementById('expDate').value = new Date().toISOString().slice(0, 10);
    document.getElementById('expCategory').value = 'Rent & Utilities';
    document.getElementById('expTitle').value = '';
    document.getElementById('expAmount').value = '';
    document.getElementById('expMethod').value = 'Cash';
    document.getElementById('expPaidBy').value = '';
    document.getElementById('expRefNo').value = '';
    document.getElementById('expNotes').value = '';
  }
  document.getElementById('expenseModal').classList.add('open');
}

function closeExpenseModal() {
  document.getElementById('expenseModal').classList.remove('open');
}

async function saveExpenseRecord(ev) {
  ev.preventDefault();
  const editId = document.getElementById('editExpId').value.trim();
  const user = getCurrentUser() || {};
  const payload = {
    date: document.getElementById('expDate').value,
    category: document.getElementById('expCategory').value,
    title: document.getElementById('expTitle').value.trim(),
    amount: parseFloat(document.getElementById('expAmount').value) || 0,
    payment_method: document.getElementById('expMethod').value,
    paid_by: document.getElementById('expPaidBy').value.trim(),
    ref_no: document.getElementById('expRefNo').value.trim(),
    notes: document.getElementById('expNotes').value.trim()
  };

  if (editId) {
    try { await sbUpdate('warehouse_expenses', editId, payload); } catch (e) {}
    const idx = expensesList.findIndex(x => x.id == editId);
    if (idx !== -1) Object.assign(expensesList[idx], payload);
    showToast('Expense updated');
  } else {
    payload.expense_no = generateDocNumber('EXP');
    payload.created_by = user.name || 'Super User';
    let saved = null;
    try {
      const r = await sbInsert('warehouse_expenses', payload);
      saved = Array.isArray(r) ? r[0] : r;
    } catch (e) {}
    if (!saved || !saved.id) saved = { ...payload, id: 'exp_' + Date.now(), created_at: new Date().toISOString() };
    expensesList.unshift(saved);
    showToast('Expense recorded');
  }

  try { localStorage.setItem(LS_EXP_KEY, JSON.stringify(expensesList)); } catch (e) {}
  closeExpenseModal();
  renderExpensesList();
}

async function deleteExpense(id) {
  if (!confirm('Delete this expense record?')) return;
  try { await sbDelete('warehouse_expenses', id); } catch (e) {}
  expensesList = expensesList.filter(x => x.id != id);
  try { localStorage.setItem(LS_EXP_KEY, JSON.stringify(expensesList)); } catch (e) {}
  renderExpensesList();
  showToast('Expense deleted');
}

function exportLuxuryExpensesPdf() {
  const mon = document.getElementById('expMonthFilter').value;
  const cat = document.getElementById('expCatFilter').value;
  const list = getFilteredExpenses();
  previewDocument(buildMonthlyExpensesReportPdf(mon, list, cat), `Warehouse Expenses - ${mon || 'All'}`);
}

document.addEventListener('DOMContentLoaded', initExpensesPage);
</script>
</body>
</html>
